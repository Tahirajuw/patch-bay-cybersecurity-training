</div>

var LEVELS=[
  {id:'INC-1041',sev:'crit',title:'Anyone can log in as admin',tags:['SQL injection','Parameterized queries'],
   brief:'A user reports being logged in as admin without knowing the password. You have the login code. Reproduce the bug, then patch it.',
   hints:['Single quotes end strings. What happens when your input contains one?','Close the username string, then add a condition that is always true: try <code>admin\' OR \'1\'=\'1</code> and read the highlighted query.','If the password check still blocks you, cut the rest of the query off with a comment. Try the username <code>admin\'--</code>.'],
   mount:mountSqli,
   learn:[['Why it worked','The app glued your text into the SQL string, so the database could not tell your data from the program\'s instructions. A quote ended the string and everything after it ran as SQL.'],
          ['The fix','Parameterized queries send the SQL and the values separately, so input can only ever be a value. Most ORMs do this by default; hand-built strings are where the bug returns.'],
          ['Also do','Give the app\'s database account only the privileges it needs, and store password hashes, never plain passwords. Injection has been on OWASP\'s Top 10 list for years.']]},
  {id:'INC-1042',sev:'high',title:'Stolen password hashes',tags:['Password strength','Offline cracking'],
   brief:'The staff portal\'s password hashes were stolen and are being cracked offline. Pick a replacement for the shared service account.',
   hints:['Length beats cleverness. Crackers try words, names and years first.','Four or more unrelated words joined by dashes score very well if the words are random.','Try something like <code>maple-harbor-quiet-lamp-orbit</code>, or a random string of 14 or more characters.'],
   mount:mountPassword,
   learn:[['Length is the lever','Each extra random character multiplies the guesses needed. A long random passphrase beats a short, symbol-heavy password, and is easier to remember.'],
          ['Patterns are public','Crackers try dictionary words, names, keyboard runs and years with common swaps like @ for a before they brute-force. A capital letter first and 1! last is a predictable shape.'],
          ['Beyond strength','Use a different password per site and turn on multi-factor authentication. On the server, slow hashing such as bcrypt, scrypt or Argon2 cuts the attacker\'s guess rate sharply.']]},
  {id:'INC-1043',sev:'med',title:'Staff report a suspicious email',tags:['Phishing','Email forensics'],
   brief:'Several staff received the email below. Tap anything that looks like evidence. Careful: not every detail that looks official or unusual is evidence.',
   hints:['Start with the sender: read the address after the @, not the display name.','A link\'s true destination matters more than its label. Read the domain right to left up to the first single slash.','There are five red flags: the sender domain, the urgency, the generic greeting, the link target and the attachment name.'],
   mount:mountPhish,
   learn:[['Read the real address','Display names and link text are free text. The domain that counts sits right before the first single slash, read from right to left.'],
          ['Pressure is a tell','Urgency, threats and rewards exist to rush you past the checks you just did.'],
          ['What to do','Do not click or reply. Report through your organization\'s channel and delete. If you already clicked, say so right away: speed of reporting matters more than embarrassment.']]},
  {id:'INC-1044',sev:'high',title:'Guestbook runs strangers\' code',tags:['Cross-site scripting','Output encoding'],
   brief:'Reviewers say the guestbook page shows odd popups. Review the handler and find the line that creates the hole.',
   hints:['Look for the line where data from the database is turned into HTML.','Find where untrusted strings are concatenated into markup that goes to every visitor.','Line 5 is the one.'],
   mount:mountXss,
   learn:[['Why it worked','Text from visitors was placed into HTML unchanged, so the browser treated it as part of the page. This is stored cross-site scripting: the attack is saved and served to everyone.'],
          ['The fix','Encode output for the context it lands in. Most template engines escape by default; use them, and when writing by hand prefer <code>textContent</code> over <code>innerHTML</code>.'],
          ['Extra layers','A Content Security Policy limits what injected code can do, and HttpOnly cookies keep session cookies away from page scripts. They back up the fix and never replace it.']]},
  {id:'INC-1045',sev:'high',title:'Who is hammering the server?',tags:['Log analysis','Brute force'],
   brief:'The SSH log is below. Inspect the addresses, find the source that matters and contain it. Then check whether it got in.',
   hints:['Attackers try many accounts quickly. Look for a burst of failures within seconds, not hours.','Tap an IP to see failed count, usernames tried and the time span.','The office address has the most logins overall, but they are spread over a day and each is followed by a success. Compare it with the 203.0.113.x address.'],
   mount:mountLogs,
   learn:[['Patterns, not counts','The office had more total logins. The attacker stood out by speed and by how many different usernames it tried. Rate and variety separate an attack from forgetful people.'],
          ['Failures are half the story','After a burst of failures, always look for a success. That one line is the breach.'],
          ['Respond in order','Contain (disable the account, block the source), investigate what the account did, rotate secrets, then harden with key-based SSH, multi-factor authentication and rate limiting such as fail2ban.']]},
  {id:'INC-1046',sev:'med',title:'Write the firewall rules',tags:['Firewalls','Least privilege'],
   brief:'The new web server 10.0.5.20 has no rules yet. Apply the policy to each incoming packet and see which ones get through.',
   hints:['Default deny: if no rule allows a packet, block it.','SSH is allowed only from 10.0.9.0/24. Check each SSH source address against that range.','Internal addresses outside 10.0.9.0/24 are not trusted for SSH. Web ports 80 and 443 are allowed from anywhere, and nothing else is.'],
   mount:mountFirewall,
   learn:[['Default deny','Write rules for what is allowed and drop the rest. A forgotten service then stays closed instead of silently open.'],
          ['Least privilege','Open only the ports a service needs, to only the networks that need them. SSH open to the world is what produced the log in the last ticket.'],
          ['Inside is not trusted','10.0.7.5 is an internal address and still gets blocked. Where a packet comes from is not proof of who sent it or whether it should be there.']]}
];
var SEV={crit:'Critical',high:'High',med:'Medium'};

/* ---------- rendering ---------- */
function totalXp(){return LEVELS.reduce(function(a,L){return a+(save.done[L.id]||0);},0);}
function rankFor(x){var f=x/(LEVELS.length*100); return f>=0.9?'Incident lead':f>=0.7?'Senior analyst':f>=0.4?'Analyst':'Trainee';}
function renderStats(){var x=totalXp(); $('#xp').textContent=x+' / '+LEVELS.length*100; $('#rank').textContent=rankFor(x);}
function renderQueue(){
  var q=$('#qlist');
  q.innerHTML=LEVELS.map(function(L,i){
    var d=save.done[L.id];
    return '<button type="button" class="ticket" data-i="'+i+'" aria-current="'+(i===cur)+'"><span class="tid">'+L.id+'</span><span class="sev '+L.sev+'">'+SEV[L.sev]+'</span><span class="tt">'+L.title+'</span><span class="st '+(d?'done':'')+'">'+(d?'Closed · '+d+' XP':'Open')+'</span></button>';
  }).join('')+'<button type="button" class="ticket" data-i="-1" aria-current="'+(cur===-1)+'"><span class="tt">Shift report</span><span class="st">Scores and rank</span></button>';
  $$('.ticket',q).forEach(function(b){b.addEventListener('click',function(){var i=+b.dataset.i; if(i===-1) showReport(true); else openLevel(i,true);});});
}
function openLevel(i,user){
  cur=i; run={wrong:0,hints:0,solved:false};
  var L=LEVELS[i];
  main.innerHTML=
    '<article class="panel"><div class="meta"><span class="tid" style="font:500 12px var(--mono);color:var(--ink-2)">'+L.id+'</span><span class="sev '+L.sev+'" style="justify-self:auto">'+SEV[L.sev]+'</span>'+L.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div>'+
    '<h2>'+L.title+'</h2><p class="brief">'+L.brief+'</p>'+
    '<div id="ws"></div>'+
    '<div class="bar"><div class="row"><button class="btn sec" id="hintbtn" type="button">Hint (&minus;20 XP)</button><span class="pot" id="pot"></span></div>'+
    '<ol class="hints" id="hints"></ol><div class="say" id="say" role="status" aria-live="polite">Read the brief, then work the ticket.</div></div>'+
    '<div id="debrief" class="debrief" hidden></div></article>';
  $('#hintbtn').addEventListener('click',function(){
    if(run.hints>=L.hints.length||run.solved) return;
    $('#hints').insertAdjacentHTML('beforeend','<li>'+L.hints[run.hints++]+'</li>');
    if(run.hints>=L.hints.length) this.disabled=true;
    pot();
  });
  L.mount($('#ws'));
  pot(); renderQueue(); renderStats();
  if(user) main.scrollIntoView({block:'start'});
}
function showDebrief(sc){
  var L=LEVELS[cur], d=$('#debrief'), last=cur===LEVELS.length-1;
  d.hidden=false;
  d.innerHTML='<h3>Ticket closed · '+sc+' XP</h3><div class="learn">'+L.learn.map(function(x){return '<div><h4>'+x[0]+'</h4><p>'+x[1]+'</p></div>';}).join('')+'</div>'+
    '<div class="row"><button class="btn" id="next" type="button">'+(last?'See shift report':'Next ticket')+'</button><button class="btn sec" id="again" type="button">Replay for a better score</button></div>';
  $('#next').addEventListener('click',function(){if(last) showReport(true); else openLevel(cur+1,true);});
  $('#again').addEventListener('click',function(){openLevel(cur,true);});
  d.scrollIntoView({block:'nearest'});
}
function showReport(user){
  cur=-1; var x=totalXp(), closed=LEVELS.filter(function(L){return save.done[L.id];}).length;
  main.innerHTML=
    '<article class="panel"><span class="lbl" style="margin-top:0">Shift report</span><h2>'+rankFor(x)+'</h2>'+
    '<p class="brief">'+closed+' of '+LEVELS.length+' tickets closed, '+x+' of '+LEVELS.length*100+' XP earned.'+(closed<LEVELS.length?' Open tickets are waiting in the queue.':' Replay any ticket to raise its score.')+'</p>'+
    '<div class="scroll"><table class="rep"><thead><tr><th>Ticket</th><th>Skill practiced</th><th>XP</th></tr></thead><tbody>'+
    LEVELS.map(function(L){return '<tr><td>'+L.id+' '+L.title+'</td><td>'+L.tags.join(', ')+'</td><td class="xp">'+(save.done[L.id]?save.done[L.id]+' / 100':'open')+'</td></tr>';}).join('')+
    '</tbody></table></div>'+
    '<div class="row"><button class="btn sec" id="reset" type="button">Reset progress</button></div></article>';
  var rb=$('#reset'), armed=false, t;
  rb.addEventListener('click',function(){
    if(!armed){armed=true; rb.textContent='Click again to erase all scores'; t=setTimeout(function(){armed=false; rb.textContent='Reset progress';},4000); return;}
    clearTimeout(t); save={done:{}}; persist(); renderStats(); openLevel(0,true);
  });
  renderQueue(); renderStats();
  if(user) main.scrollIntoView({block:'start'});
}

var first=0; for(var i=0;i<LEVELS.length;i++){if(!save.done[LEVELS[i].id]){first=i;break;}}
openLevel(first,false);
})();
</script>

</body></html>
